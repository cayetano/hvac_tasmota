<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aire Acondicionado · Tasmota IR</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #5f6b80;
    --primary: #2563eb;
    --primary-soft: #dbeafe;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --warning: #d97706;
    --warning-soft: #fef3c7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --cool: #0ea5e9;
    --heat: #ef4444;
    --border: #e5e7ef;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 4px 16px rgba(16,24,40,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: 16px; min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
  .subtitle { color: var(--muted); margin-bottom: 14px; font-size: 13px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
  .card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: var(--shadow);
          border: 1px solid var(--border); }
  .c12 { grid-column: span 12; }
  .c4 { grid-column: span 4; }
  @media (max-width: 640px) { .c4 { grid-column: span 12; } }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  input[type="number"], select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; background: #fff; color: var(--text); outline: none;
  }
  input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; min-width: 0; }

  button {
    appearance: none; border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: transform .03s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    user-select: none;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; border-color: #1d4ed8; }
  .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
  .btn-success:hover:not(:disabled) { background: #15803d; border-color: #15803d; }
  .btn-danger  { background: var(--danger);  border-color: var(--danger);  color: #fff; }
  .btn-danger:hover:not(:disabled)  { background: #b91c1c; border-color: #b91c1c; }
  .btn-warning { background: var(--warning); border-color: var(--warning); color: #fff; }
  .btn-ghost   { background: transparent; }
  .btn-ghost:hover:not(:disabled) { background: #f1f5f9; }
  .btn-sm      { padding: 8px 10px; font-size: 13px; border-radius: 8px; }

  .seg { display: flex; gap: 4px; padding: 4px; background: #f1f5f9; border-radius: 10px; flex-wrap: wrap; }
  .seg button { flex: 1 1 0; min-width: 0; background: transparent; border: 0; color: var(--muted);
                font-size: 13px; border-radius: 8px; padding: 8px 10px; }
  .seg button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06);
                       border: 1px solid var(--border); }
  .seg button.cool.active { color: var(--cool); }
  .seg button.heat.active { color: var(--heat); }

  .big-display {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 4px 0 14px;
  }
  .stat {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 12px;
    text-align: center;
  }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
  .stat .value { font-size: 24px; font-weight: 800; margin-top: 4px; letter-spacing: .5px; }
  .stat.cool-on .value { color: var(--cool); }
  .stat.heat-on .value { color: var(--heat); }
  .stat.on-badge  { background: linear-gradient(180deg, #ecfdf5 0%, #dcfce7 100%); border-color: #bbf7d0; }
  .stat.on-badge  .value { color: var(--success); }
  .stat.off-badge { background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%); }
  .stat.off-badge .value { color: var(--muted); }

  .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }

  details { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; }

  .footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: 12px; }
  .footer code { background: #f1f5f9; padding: 1px 6px; border-radius: 6px; color: #334155; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌬️ Aire Acondicionado</h1>
  <div class="subtitle">Control directo desde el propio Tasmota · IRHVAC COOLIX</div>

  <div class="grid">
    <section class="card c12">
      <div class="big-display">
        <div class="stat" id="statPower">
          <div class="label">Estado</div>
          <div class="value" id="vPower">OFF</div>
        </div>
        <div class="stat cool-on" id="statTemp">
          <div class="label">ºC</div>
          <div class="value" id="vTemp">25</div>
        </div>
        <div class="stat" id="statFan">
          <div class="label">Vent</div>
          <div class="value" id="vFan">Min</div>
        </div>
      </div>

      <div class="row" style="margin-bottom: 12px;">
        <button id="btnOn"  class="btn-success" style="flex:1;">✅ ON</button>
        <button id="btnOff" class="btn-danger"  style="flex:1;">⛔ OFF</button>
      </div>

      <label>Modo</label>
      <div class="seg" id="segMode" style="margin-bottom: 14px;">
        <button data-mode="Cool"  class="cool active">❄️ Cool</button>
        <button data-mode="Heat"  class="heat">🔥 Heat</button>
        <button data-mode="Dry"   >💧 Dry</button>
        <button data-mode="Fan"   >🌀 Fan</button>
        <button data-mode="Auto"  >🔁 Auto</button>
      </div>

      <div class="row" style="align-items: center; gap: 10px; margin-bottom: 14px;">
        <label style="min-width: 90px; margin: 0;">Temp</label>
        <button id="btnTempDown" class="btn-warning"
                style="flex: 0 0 auto; min-width: 72px; min-height: 56px; font-size: 26px; font-weight: 800;">−</button>
        <input id="inputTemp" type="number" min="16" max="32" step="1" value="25"
               style="flex: 0 0 120px; min-height: 56px; text-align:center;
                      font-weight: 800; font-size: 22px;" />
        <button id="btnTempUp" class="btn-primary"
                style="flex: 0 0 auto; min-width: 72px; min-height: 56px; font-size: 26px; font-weight: 800;">+</button>
        <div class="hint" style="flex: 1 1 auto; margin: 0;">16-32</div>
      </div>

      <div class="row" style="align-items: center; gap: 10px; margin-bottom: 14px;">
        <label style="min-width: 90px; margin: 0;">Vent</label>
        <button id="btnFanDown" class="btn-ghost" aria-label="Menos" title="Menos"
                style="flex: 0 0 auto; min-width: 64px; min-height: 52px; font-size: 22px;">⏪</button>
        <div class="seg" id="segFan" style="flex: 1 1 auto; justify-content:center;">
          <button data-fan="Min"    class="active">Min</button>
          <button data-fan="Low"    >Low</button>
          <button data-fan="Medium" >Med</button>
          <button data-fan="High"   >High</button>
          <button data-fan="Max"    >Max</button>
          <button data-fan="Auto"   >Auto</button>
        </div>
        <button id="btnFanUp" class="btn-ghost" aria-label="Más" title="Más"
                style="flex: 0 0 auto; min-width: 64px; min-height: 52px; font-size: 22px;">⏩</button>
      </div>

      <details>
        <summary>+ Opciones avanzadas</summary>
        <div class="grid" style="margin-top: 12px;">
          <div class="c4">
            <label>SwingV</label>
            <select id="selSwingV">
              <option>Off</option><option>Auto</option>
              <option>Min</option><option>Low</option><option>Middle</option>
              <option>High</option><option>Max</option>
            </select>
          </div>
          <div class="c4">
            <label>SwingH</label>
            <select id="selSwingH">
              <option>Off</option><option>Auto</option>
              <option>Left</option><option>Middle</option><option>Right</option>
              <option>LeftMax</option><option>RightMax</option>
            </select>
          </div>
          <div class="c4">
            <label>&nbsp;</label>
            <div class="row" style="gap:6px;">
              <button class="btn-ghost btn-sm" id="btnToggleQuiet">Quiet: Off</button>
              <button class="btn-ghost btn-sm" id="btnToggleTurbo">Turbo: Off</button>
            </div>
            <div class="row" style="gap:6px; margin-top:6px;">
              <button class="btn-ghost btn-sm" id="btnToggleEcono">Econo: Off</button>
              <button class="btn-ghost btn-sm" id="btnToggleLight">Light: Off</button>
            </div>
            <div class="row" style="gap:6px; margin-top:6px;">
              <button class="btn-ghost btn-sm" id="btnToggleBeep">Beep: Off</button>
              <button class="btn-ghost btn-sm" id="btnToggleFilter">Filter: Off</button>
            </div>
          </div>
        </div>
      </details>

      <div class="row" style="margin-top: 14px;">
        <button id="btnSend" class="btn-primary" style="flex:1;">📤 Enviar</button>
      </div>
    </section>
  </div>

  <div class="footer">
    Tasmota IR · <code>IRHVAC Vendor=COOLIX</code>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const FAN_SPEEDS = ["Min","Low","Medium","High","Max","Auto"];
const LS_KEY_STATE = "tasmota.hvac.state.v1";

const state = {
  Power: "Off", Mode: "Cool", Temp: 25, FanSpeed: "Min",
  SwingV: "Off", SwingH: "Off",
  Quiet: "Off", Turbo: "Off", Econo: "Off", Light: "Off",
  Filter: "Off", Clean: "Off", Beep: "Off", Sleep: -1, iFeel: "Off",
};

function persistState() { try { localStorage.setItem(LS_KEY_STATE, JSON.stringify(state)); } catch(e) {} }
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY_STATE) || "null");
    if (s) for (const k of Object.keys(state)) if (k in s) state[k] = s[k];
  } catch(e) {}
}

function buildHvacPayload() {
  return {
    Vendor:   "COOLIX", Model: -1, Command: "Control",
    Mode:     state.Mode, Power: state.Power, Celsius: "On",
    Temp:     clamp(Number(state.Temp) || 25, 16, 32),
    FanSpeed: state.FanSpeed,
    SwingV:   state.SwingV, SwingH: state.SwingH,
    Quiet:    state.Quiet,  Turbo:  state.Turbo,
    Econo:    state.Econo,  Light:  state.Light,
    Filter:   state.Filter, Clean:  state.Clean,
    Beep:     state.Beep,   Sleep:  state.Sleep, iFeel: state.iFeel,
  };
}

async function enviar(cmnd) {
  const base = window.location.origin;
  const url = base + "/cm?cmnd=" + encodeURIComponent(cmnd);
  const res = await fetch(url, { method: "GET", mode: "cors", cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  let data = null;
  try { data = await res.json(); } catch(e) {}
  return { ok: true, status: res.status, data };
}

async function sendHvac(sendBacklog = true) {
  const json = JSON.stringify(buildHvacPayload());
  const cmnd = sendBacklog ? `Backlog IRHVAC ${json}; STATUS` : `IRHVAC ${json}`;
  return enviar(cmnd);
}

async function sendCurrentAndSave(logicLabel) {
  setBusy(true);
  try {
    persistState();
    await sendHvac(true);
  } catch (err) {
    // Silencioso: sin panel de logs. Feedback OK/NOK por botón disabled.
  } finally {
    setTimeout(() => setBusy(false), 300);
  }
}

function setBusy(b) {
  for (const id of ["btnOn","btnOff","btnTempUp","btnTempDown","btnFanUp","btnFanDown","btnSend"]) {
    const el = $(id); if (el) el.disabled = !!b;
  }
}

function syncUiFromState() {
  const sp = $("statPower");
  sp.classList.remove("on-badge", "off-badge");
  if (state.Power === "On") { sp.classList.add("on-badge");  $("vPower").textContent = "ON";  }
  else                      { sp.classList.add("off-badge"); $("vPower").textContent = "OFF"; }

  $("vTemp").textContent = `${state.Temp}`;
  const st = $("statTemp");
  st.classList.remove("cool-on", "heat-on");
  if (state.Mode === "Cool") st.classList.add("cool-on");
  if (state.Mode === "Heat") st.classList.add("heat-on");
  $("inputTemp").value = state.Temp;

  $("vFan").textContent = state.FanSpeed;
  [...document.querySelectorAll("#segFan button")].forEach(b =>
    b.classList.toggle("active", b.dataset.fan === state.FanSpeed));
  [...document.querySelectorAll("#segMode button")].forEach(b =>
    b.classList.toggle("active", b.dataset.mode === state.Mode));

  $("selSwingV").value = state.SwingV;
  $("selSwingH").value = state.SwingH;
  for (const key of ["Quiet","Turbo","Econo","Light","Beep","Filter"]) {
    const btn = $("btnToggle" + key);
    if (btn) btn.textContent = `${key}: ${state[key]}`;
  }
}

function toggle(key) {
  state[key] = state[key] === "On" ? "Off" : "On";
  syncUiFromState(); persistState();
}

function bindEvents() {
  $("btnOn").onclick  = async () => { state.Power = "On";  await sendCurrentAndSave("on");  syncUiFromState(); };
  $("btnOff").onclick = async () => { state.Power = "Off"; await sendCurrentAndSave("off"); syncUiFromState(); };

  $("btnTempUp").onclick = async () => {
    state.Temp = clamp(Number(state.Temp) + 1, 16, 32); state.Power = "On";
    syncUiFromState();
    await sendCurrentAndSave("t+");
  };
  $("btnTempDown").onclick = async () => {
    state.Temp = clamp(Number(state.Temp) - 1, 16, 32); state.Power = "On";
    syncUiFromState();
    await sendCurrentAndSave("t-");
  };
  $("inputTemp").addEventListener("change", () => {
    const v = Number($("inputTemp").value);
    if (Number.isFinite(v)) state.Temp = clamp(Math.round(v), 16, 32);
    syncUiFromState(); persistState();
  });

  $("btnFanUp").onclick = async () => {
    const i = FAN_SPEEDS.indexOf(state.FanSpeed);
    state.FanSpeed = FAN_SPEEDS[clamp(i + 1, 0, FAN_SPEEDS.length - 1)];
    syncUiFromState();
    await sendCurrentAndSave("f+");
  };
  $("btnFanDown").onclick = async () => {
    const i = FAN_SPEEDS.indexOf(state.FanSpeed);
    state.FanSpeed = FAN_SPEEDS[clamp(i - 1, 0, FAN_SPEEDS.length - 1)];
    syncUiFromState();
    await sendCurrentAndSave("f-");
  };
  [...document.querySelectorAll("#segFan button")].forEach(b => b.addEventListener("click", () => {
    state.FanSpeed = b.dataset.fan; syncUiFromState(); persistState();
  }));
  [...document.querySelectorAll("#segMode button")].forEach(b => b.addEventListener("click", () => {
    state.Mode = b.dataset.mode; syncUiFromState(); persistState();
  }));

  $("selSwingV").addEventListener("change", e => { state.SwingV = e.target.value; syncUiFromState(); persistState(); });
  $("selSwingH").addEventListener("change", e => { state.SwingH = e.target.value; syncUiFromState(); persistState(); });
  for (const k of ["Quiet","Turbo","Econo","Light","Beep","Filter"]) {
    const btn = $("btnToggle" + k);
    if (btn) btn.addEventListener("click", () => toggle(k));
  }

  $("btnSend").onclick = async () => { await sendCurrentAndSave("manual"); syncUiFromState(); };
}

function boot() {
  loadState();
  bindEvents();
  syncUiFromState();
}
boot();
</script>
</body>
</html>
